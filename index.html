<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rica Website" />
    <title>Rica Website</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090b10;
        color: #f7f7f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.24), transparent 32rem),
          radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.18), transparent 30rem),
          #090b10;
      }

      main {
        width: min(42rem, calc(100% - 2rem));
        padding: clamp(2rem, 8vw, 4rem);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1.5rem;
        background: rgba(17, 20, 29, 0.78);
        box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.25rem, 10vw, 4.5rem);
        letter-spacing: -0.06em;
      }

      p {
        margin: 0;
        color: #b8bdc9;
        font-size: clamp(1rem, 3vw, 1.25rem);
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rica</h1>
      <p>Your website is live.</p>
    </main>
  </body>
</html>
